<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.main.css' rel="stylesheet">
    <title>Caio Login Page</title>
</head>
<body>

    <header class="header">
        <div class="navbar">
            <a href="#">Home</a>
            <a href="#">Sobre</a>
            <a href="#">Serviços</a>
            <a href="#">Contato</a>
        </div>

        <form action="#" class="Search-bar">
            <input type="text" placeholder="Pesquisar...">
            <button type="Submit"><img width="10" height="10" src="https://img.icons8.com/ios/10/search--v1.png" alt="search--v1"/></button>
        </form>
    </header>

    <div class="background"></div>
    <div class="container">
        <div class="content">
            <h2 class="logo">Website</h2>

            <a class="text-sci">
                <h2>Bem Vindo!<br><span>Ao Seu Website</span></h2>

                <p>Este projeto é puramente ilustrativo, com base nos estudos pessoais, excercicio do freecodecamp e Referencias externas. Uma versão futura com Javascript será feito.</p>

                <div class="social-icons">
                    <a href="#"><img width="30" height="30" src="https://img.icons8.com/ios-filled/30/e4e4e4/instagram-new--v1.png" alt="instagram-new--v1"/></a>
                    <a href="#"><img width="30" height="30" src="https://img.icons8.com/ios-filled/30/e4e4e4/twitterx--v2.png" alt="twitterx--v2"/></a>
                    <a href="#"><img width="30" height="30" src="https://img.icons8.com/ios-filled/30/e4e4e4/linkedin.png" alt="linkedin"/></a>
                    <a href="#"><img width="30" height="30" src="https://img.icons8.com/ios-filled/30/e4e4e4/facebook--v1.png" alt="facebook--v1"/></a>
                </div>
            </div>
    

        <div class="logreg-box">
            <div class="form-box login">
                <form action="#">
                    <h2>Login</h2>

                    <div class="input-box">
                        <span class="icon"><img width="20" height="20" src="https://img.icons8.com/ios-filled/30/e4e4e4/mail.png" alt="mail"/></span>
                        <input type="email" required>
                        <label>Email</label>
                    </div>

                    <div class="input-box">
                        <span class="icon"><img width="20" height="20" src="https://img.icons8.com/sf-black-filled/30/e4e4e4/password.png" alt="password"/></span>
                        <input type="Password" required>
                        <label>Password</label>
                    </div>

                    <div class="remenber-forgot">
                        <label><input type="checkbox"></label>
                        <a href="#">Forgot password?</a>
                    </div>

                    <button type="submit" class="btn">Faça Login</button>

                    <div class="login-register">
                        <p>Não tem uma senha?<a href="#" class="register-link">Crie uma</a></p>
                        
                    </div>
                </form>
            </div>
        </div>
    </div>
    
</body>
</html>
